[project]
name = "catfold"
version = "0.1.0"
description = "CaTFold RNA secondary-structure prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.24",
    "forgi>=2.2",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "networkx==3.1",
    "numpy==1.26.4",
    "torch==2.1.0+cu118",
    "tqdm>=4.66",
    "viennarna>=2.6",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
